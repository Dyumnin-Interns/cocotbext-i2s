jobs:
  test: # Or whatever your job is named
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Or your desired version

      # Your step to install PDM and dependencies...
      - name: Install dependencies
        run: |
          pip install pdm
          pdm install

      # -----------------------------------------------------------
      # ▼ ADD THIS NEW STEP TO INSTALL THE GHDL SIMULATOR ▼
      # -----------------------------------------------------------
      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
      # -----------------------------------------------------------
      # ▲ END OF THE NEW STEP ▲
      # -----------------------------------------------------------

      - name: Run tests
        run: pdm run duty test
